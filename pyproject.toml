[project]
name = "claude-delta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deltachat-rpc-client>=2.0",
    "deltachat-rpc-server>=2.0",
    "faster-whisper>=1.0",
]

[project.scripts]
claude-delta = "claude_delta.cli:main"
claude-delta-daemon = "claude_delta.daemon:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
